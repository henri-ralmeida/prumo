<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Graph Engine</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='4' cy='8' r='3' fill='%2334c268'/%3E%3Ccircle cx='12' cy='8' r='3' fill='%23fcb400'/%3E%3C/svg%3E" />
<style>
  :root {
    --bg: #0b0b0e; --panel: #141419; --card: #1b1b22; --card-hi: #22222b; --line: #2b2b35;
    --text: #e8e8ee; --dim: #85859a; --accent: #fcb400;
    --ready: #3b82f6; --running: #fcb400; --done: #34c268; --failed: #ef4444;
    --waiting: #4c4c58; --blocked: #a855f7; --skipped: #3a3a44; --review: #22d3ee;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 13px/1.45 ui-monospace, "Cascadia Code", Menlo, monospace; overflow: hidden; }
  header { display: flex; align-items: center; padding: 10px 18px; border-bottom: 1px solid var(--line); height: 46px; }
  header h1 { font-size: 14px; font-weight: 600; margin-right: 14px; }
  header .run { color: var(--dim); margin-right: auto; font-size: 12px; }
  .counts span { margin-left: 12px; color: var(--dim); font-size: 12px; }
  .counts b { color: var(--text); }
  main { display: grid; grid-template-columns: 1fr 330px; height: calc(100vh - 46px - 44px); }
  #viewport { overflow: hidden; position: relative; cursor: grab; touch-action: none;
              background-image: radial-gradient(circle, #1a1a21 1px, transparent 1px);
              background-size: 26px 26px; }
  #viewport.panning { cursor: grabbing; }
  #canvas { position: absolute; top: 0; left: 0; transform-origin: 0 0; will-change: transform; }

  /* ---- level of detail: zoomed out, a card must read by COLOUR and id alone —
     the subtitle at 40% scale is noise, and the id needs to grow to survive the shrink */
  #canvas[data-lod="far"] .node .sub,
  #canvas[data-lod="far"] .node .elapsed { display: none; }
  #canvas[data-lod="far"] .node .id { font-size: 19px; line-height: 30px; }
  #canvas[data-lod="far"] .lane-h { font-size: 17px; }
  #canvas[data-lod="far"] #orchNode .os { font-size: 15px; }
  #canvas[data-lod="far"] #orchNode .oh { font-size: 18px; }

  /* ---- edges: one <path> per dependency so lineage focus can light them individually */
  svg#edges { position: absolute; inset: 0; overflow: visible; pointer-events: none; }
  svg#edges path { fill: none; stroke-width: 1.4; transition: opacity .18s; }
  svg#edges path.e-done    { stroke: var(--done); opacity: .5; marker-end: url(#m-done); }
  svg#edges path.e-hot     { stroke: var(--running); stroke-width: 2; opacity: .95;
                             stroke-dasharray: 7 5; animation: flow 1s linear infinite;
                             marker-end: url(#m-hot); }
  svg#edges path.e-next    { stroke: var(--running); stroke-width: 1.6; stroke-dasharray: 2 6;
                             stroke-linecap: round; animation: flow8 .8s linear infinite, breathe 1.6s ease-in-out infinite;
                             marker-end: url(#m-next); }
  svg#edges path.e-failed  { stroke: var(--failed); stroke-width: 1.8; opacity: .8; marker-end: url(#m-failed); }
  svg#edges path.e-idle    { stroke: var(--line); marker-end: url(#m-idle); }
  /* Seamless loop requires the travelled distance to be a MULTIPLE of the dash period
     (dasharray sum): flow12 for 7+5, flow8 for 2+6, flow9 for 3+6. A shared -12 made
     the 8px and 9px patterns jump mid-loop — seen as the lines "restarting". */
  @keyframes flow { to { stroke-dashoffset: -12; } }
  @keyframes flow8 { to { stroke-dashoffset: -8; } }
  @keyframes flow9 { to { stroke-dashoffset: -9; } }
  @keyframes breathe { 50% { opacity: .35; } }

  /* ---- an edge that goes BACKWARD across lanes: a later phase feeding an earlier
     task. Rare and worth seeing — the phase numbering hides the real constraint. */
  svg#edges path.e-back { stroke: var(--blocked); stroke-width: 1.6; stroke-dasharray: 5 4;
                          opacity: .85; marker-end: url(#m-back); }

  /* ---- orchestrator hub: the DAG still reads left-to-right (causality), but the
     orchestrator gets a real presence, radiating a live line to each task it is running */
  #orchNode { position: absolute; width: 150px; height: 62px; border-radius: 14px;
              background: linear-gradient(180deg, #1e1e26, #16161c); border: 1px solid var(--line);
              padding: 9px 12px; }
  #orchNode.live { border-color: color-mix(in srgb, var(--done) 45%, var(--line));
                   box-shadow: 0 0 22px rgba(52, 194, 104, .14); }
  #orchNode .oh { font-size: 11px; font-weight: 700; letter-spacing: .04em; }
  #orchNode .os { font-size: 9.5px; color: var(--dim); display: block; margin-top: 3px;
                  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #orchNode .obeat { position: absolute; right: 11px; top: 11px; width: 7px; height: 7px;
                     border-radius: 50%; background: var(--waiting); }
  #orchNode.live .obeat { background: var(--done); animation: beat 1.1s ease-in-out infinite; }
  svg#edges path.e-dispatch { stroke: var(--accent); stroke-width: 1.5; opacity: .9;
                              stroke-dasharray: 3 6; stroke-linecap: round;
                              animation: flow9 .7s linear infinite; marker-end: url(#m-dispatch); }
  svg#edges path.e-review { stroke: var(--review); stroke-width: 1.5; opacity: .9;
                            stroke-dasharray: 3 6; stroke-linecap: round;
                            animation: flow9 .7s linear infinite; marker-end: url(#m-review); }
  #revNode { position: absolute; width: 168px; height: 60px; border-radius: 14px;
             background: linear-gradient(180deg, #16161c, #1e1e26); border: 1px solid var(--line);
             padding: 9px 12px; }
  #revNode.live { border-color: color-mix(in srgb, var(--review) 50%, var(--line));
                  box-shadow: 0 0 22px rgba(34, 211, 238, .14); }
  #revNode .oh { font-size: 11px; font-weight: 700; letter-spacing: .04em; }
  #revNode .os { font-size: 9.5px; color: var(--dim); display: block; margin-top: 3px;
                 white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #revNode .obeat { position: absolute; right: 11px; top: 11px; width: 7px; height: 7px;
                    border-radius: 50%; background: var(--waiting); }
  #revNode.live .obeat { background: var(--review); animation: beat 1.1s ease-in-out infinite; }
  #canvas[data-lod="far"] #revNode .os { font-size: 15px; }
  #canvas[data-lod="far"] #revNode .oh { font-size: 18px; }

  /* ---- phase swimlanes */
  #lanes { position: absolute; inset: 0; pointer-events: none; }
  .lane { position: absolute; left: 0; right: 0; border-radius: 12px;
          background: rgba(255, 255, 255, .017); border: 1px solid rgba(255, 255, 255, .035); }
  .lane-h { position: absolute; top: 6px; left: 14px;
            font-size: 10px; color: var(--dim); text-transform: uppercase; letter-spacing: .07em;
            white-space: nowrap; }
  .lbtn { background: var(--card); color: var(--dim); border: 1px solid var(--line);
          border-radius: 999px; padding: 3px 11px; font: inherit; font-size: 11px;
          cursor: pointer; margin-right: 8px; }
  .lbtn:hover { color: var(--text); border-color: var(--dim); }
  #zoomLvl { color: var(--dim); font-size: 11px; margin-right: 12px; min-width: 34px;
             display: inline-block; text-align: right; }

  /* ---- lineage focus: hover/selection dims everything outside the chain */
  .focus svg#edges path:not(.lit) { opacity: .07; animation: none; }
  .focus .node:not(.lit) { opacity: .16; }
  .node.lit-self { border-color: var(--accent) !important;
                   box-shadow: 0 0 0 1px var(--accent), 0 0 18px rgba(252, 180, 0, .25); }

  .node { position: absolute; width: 168px; height: 46px; background: var(--card);
          border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px 6px 30px;
          cursor: pointer; transition: border-color .15s, opacity .18s; }
  .node:hover { background: var(--card-hi); border-color: var(--dim); }
  .node .dot { position: absolute; left: 9px; top: 50%; transform: translateY(-50%);
               width: 13px; height: 13px; border-radius: 50%; display: flex;
               align-items: center; justify-content: center; font-size: 9px; color: #0b0b0e; font-weight: 800; }
  .node .id { font-weight: 700; font-size: 12px; }
  .node .sub { color: var(--dim); font-size: 10px; white-space: nowrap; overflow: hidden;
               text-overflow: ellipsis; display: block; }
  .node .ag { color: var(--accent); font-size: 10px; }
  .node .elapsed { position: absolute; right: 8px; top: 5px; font-size: 9px; color: var(--running); }
  .node[data-st="done"]    { border-color: color-mix(in srgb, var(--done) 45%, var(--line)); }
  .node[data-st="done"] .dot    { background: var(--done); }
  /* Running/reviewing cards hold a STEADY glow — motion belongs to the edges and the
     typing dots; a repeating box-shadow pulse makes the card text shimmer (dev, 2026-08-25). */
  .node[data-st="running"] { border-color: var(--running); box-shadow: 0 0 10px 0 rgba(252, 180, 0, .22); }
  .node[data-st="running"] .dot { background: var(--running); }
  .node[data-st="ready"] .dot   { background: var(--ready); box-shadow: 0 0 6px 1px rgba(59, 130, 246, .45); }
  .node[data-st="ready"]   { border-color: color-mix(in srgb, var(--ready) 55%, var(--line)); }
  .node[data-st="failed"]  { border-color: var(--failed); }
  .node[data-st="failed"] .dot  { background: var(--failed); color: #fff; }
  .node[data-st="waiting"] .dot { background: var(--waiting); }
  .node[data-st="waiting"] { opacity: .72; }
  .node[data-st="reviewing"] { border-color: var(--review); box-shadow: 0 0 10px 0 rgba(34, 211, 238, .22); }
  .node[data-st="reviewing"] .dot { background: var(--review); }
  .node[data-st="reviewing"] .ag { color: var(--review); }
  .node[data-st="blocked"] { border-color: var(--blocked); }
  .node[data-st="blocked"] .dot { background: var(--blocked); }
  /* blocked = a QUESTION for the dev, and the dev is exactly who is looking at this screen —
     so the card itself says so; a legend colour alone asks to be decoded */
  .ask { color: var(--blocked); font-weight: 600; }
  .node[data-st="skipped"] { opacity: .38; }
  .node[data-st="skipped"] .dot { background: var(--skipped); }

  /* ---- subagent at work: orbiting ring on the dot + typing dots beside the agent name */
  .node[data-st="running"] .dot::before { content: ''; position: absolute; inset: -5px; border-radius: 50%;
               border: 1px dashed rgba(252, 180, 0, .75); border-left-color: transparent;
               animation: spin 2.4s linear infinite; animation-delay: var(--epoch, 0s); }
  @keyframes spin { to { transform: rotate(360deg); } }
  .work { display: inline-block; margin-left: 4px; }
  .work i { display: inline-block; width: 3px; height: 3px; border-radius: 50%; background: var(--accent);
            margin-right: 2px; animation: wdot 1s ease-in-out infinite; animation-delay: var(--epoch, 0s); }
  .work i:nth-child(2) { animation-delay: calc(.16s + var(--epoch, 0s)); }
  .work i:nth-child(3) { animation-delay: calc(.32s + var(--epoch, 0s)); }
  @keyframes wdot { 35% { transform: translateY(-3px); opacity: 1; } 70% { opacity: .35; } }

  /* ---- validator sub-state on a running node: current attempt validated → calm blue,
     awaiting the orchestrator's `done`; validation failed → agent reworking */
  .vbadge { font-size: 9.5px; margin-left: 4px; }
  .vbadge.ok { color: var(--ready); }
  .vbadge.bad { color: var(--failed); }
  .node[data-sub="validated"] { border-color: var(--ready); animation: none; }
  .node[data-sub="validated"] .dot { background: var(--ready); }
  .node[data-sub="validated"] .dot::before, .node[data-sub="validated"] .dot::after { display: none; }

  /* ---- one-shot flashes when an event lands on a node (start/validate/done/fail) */
  .node.flash-start { animation: fstart 1.1s ease-out; }
  .node.flash-val   { animation: fval 1.1s ease-out; }
  .node.flash-done  { animation: fdone 1.1s ease-out; }
  .node.flash-bad   { animation: fbad 1.1s ease-out; }
  @keyframes fstart { 0% { box-shadow: 0 0 0 3px rgba(252, 180, 0, .7), 0 0 26px var(--running); } }
  @keyframes fval   { 0% { box-shadow: 0 0 0 3px rgba(59, 130, 246, .7), 0 0 26px var(--ready); } }
  @keyframes fdone  { 0% { box-shadow: 0 0 0 3px rgba(52, 194, 104, .7), 0 0 26px var(--done); } }
  @keyframes fbad   { 0% { box-shadow: 0 0 0 3px rgba(239, 68, 68, .7), 0 0 26px var(--failed); } }

  /* ---- orchestrator heartbeat in the header */
  .orch { display: inline-flex; align-items: center; margin-right: 12px; font-size: 11px; color: var(--dim);
          border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
  .orch .hb { width: 7px; height: 7px; border-radius: 50%; background: var(--waiting); margin-right: 7px; }
  .orch.live { border-color: color-mix(in srgb, var(--done) 40%, var(--line)); }
  .orch.live .hb { background: var(--done); animation: beat 1.1s ease-in-out infinite; animation-delay: var(--epoch, 0s); }
  @keyframes beat { 50% { transform: scale(1.7); opacity: .5; } }
  .orch b { color: var(--text); margin: 0 4px; font-weight: 600; }

  footer { height: 44px; display: flex; align-items: center; padding: 0 18px;
           border-top: 1px solid var(--line); }
  footer .lbl { color: var(--done); margin-right: 14px; font-size: 12px; }
  #bar { flex: 1; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; display: flex; }
  #bar .seg-done { background: var(--done); transition: width .4s; }
  #bar .seg-run  { background: var(--running); transition: width .4s; opacity: .8;
                   background-image: linear-gradient(90deg, transparent 0 40%, rgba(255,255,255,.25) 50%, transparent 60% 100%);
                   background-size: 200% 100%; animation: shimmer 1.4s linear infinite; }
  #bar .seg-fail { background: var(--failed); transition: width .4s; }
  @keyframes shimmer { to { background-position: -200% 0; } }
  footer .n { margin-left: 14px; color: var(--dim); font-size: 12px; }
  footer .n b { color: var(--done); }

  /* ---- right panel: run state + logs ONLY (task details live in the modal) */
  aside { border-left: 1px solid var(--line); background: var(--panel); padding: 12px 14px; overflow-y: auto; }
  aside h3 { font-size: 11px; color: var(--dim); margin: 14px 0 6px; text-transform: uppercase; letter-spacing: .06em; }
  aside h3:first-child { margin-top: 0; }
  .ev { padding: 4px 0; border-bottom: 1px solid var(--line); font-size: 11px; }
  .ev time { color: var(--dim); margin-right: 5px; }
  .ev .t-task_done b { color: var(--done); } .ev .t-task_fail b { color: var(--failed); }
  .ev .t-task_start b { color: var(--running); } .ev .t-task_validate b { color: var(--ready); }
  .par span { display: inline-block; background: var(--card); border: 1px solid var(--running);
              border-radius: 6px; padding: 2px 8px; margin: 0 5px 5px 0; font-size: 11px; cursor: pointer; }
  .par .sp { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px;
             border: 1.5px solid var(--line); border-top-color: var(--running); vertical-align: -1px;
             animation: spin .9s linear infinite; }
  .par span.rev { border-color: var(--review); }
  .par .sp.rev { border-top-color: var(--review); }
  .legend span { display: inline-flex; align-items: center; margin: 0 10px 6px 0; color: var(--dim); font-size: 11px; }
  .legend i { width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; }
  .legend i.l-edge { width: 16px; height: 0; border-radius: 0; border-top: 2px dashed var(--running); }
  .empty { color: var(--dim); font-size: 11px; }

  /* ---- task popover: anchored beside the node — hover to peek, click to pin */
  #pop { position: fixed; width: 380px; max-height: 70vh; overflow-y: auto; background: var(--panel);
         border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px;
         box-shadow: 0 18px 48px rgba(0, 0, 0, .55); z-index: 20; display: none;
         animation: pop .14s ease-out; }
  #pop.open { display: block; }
  #pop.pinned { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
  @keyframes pop { from { opacity: 0; transform: translateY(6px) scale(.98); } }
  #pop .close { position: absolute; top: 10px; right: 12px; cursor: pointer; color: var(--dim); font-size: 13px; }
  #pop .close:hover { color: var(--text); }
  #pop .pin-hint { color: var(--dim); font-size: 9.5px; margin-top: 6px; }
  #pop h2 { font-size: 13px; display: flex; align-items: center; }
  #pop h2 .st { font-size: 10px; padding: 2px 8px; border-radius: 999px; margin-left: 10px;
                border: 1px solid; text-transform: uppercase; letter-spacing: .05em; }
  #pop dt { color: var(--dim); font-size: 10px; text-transform: uppercase; margin-top: 12px; }
  #pop dd { margin: 3px 0 0; white-space: pre-wrap; font-size: 12px; }
  #pop .dep { display: inline-block; background: var(--card); border: 1px solid var(--line);
              border-radius: 6px; padding: 1px 8px; margin: 2px 4px 2px 0; cursor: pointer; font-size: 11px; }
  #pop .dep:hover { border-color: var(--accent); }
  .vitem { border-left: 2px solid var(--done); padding: 4px 8px; margin: 5px 0; background: var(--card); font-size: 11.5px; }
  .vitem.bad { border-left-color: var(--failed); }
  .att { color: var(--dim); font-size: 11px; margin: 3px 0; }

  /* ---- results: the run measuring ITSELF. Everything here is derived from the same
     state.json + events the graph renders — no new collection, no engine involvement. */
  #results { position: fixed; inset: 46px 0 0; background: var(--bg); z-index: 15;
             overflow-y: auto; padding: 22px 26px 40px; display: none; }
  #results.open { display: block; }
  #results h2 { font-size: 13px; margin-bottom: 3px; }
  #results .note { color: var(--dim); font-size: 11px; margin-bottom: 18px; }
  #results h3 { font-size: 11px; color: var(--dim); margin: 26px 0 10px; text-transform: uppercase; letter-spacing: .06em; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(148px, 1fr)); gap: 10px; }
  .tile { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  .tile .k { color: var(--dim); font-size: 10px; text-transform: uppercase; letter-spacing: .05em; }
  .tile .v { font-size: 19px; font-weight: 600; margin-top: 3px; }
  .tile .s { color: var(--dim); font-size: 10.5px; margin-top: 2px; }
  .split { display: flex; height: 26px; border-radius: 6px; overflow: hidden; background: var(--line); }
  .split div { display: flex; align-items: center; justify-content: center; font-size: 10.5px; color: #0b0b0e; font-weight: 600; }
  .rtable { width: 100%; border-collapse: collapse; font-size: 11.5px; }
  .rtable th { text-align: left; color: var(--dim); font-weight: 400; font-size: 10px; text-transform: uppercase;
               letter-spacing: .05em; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .rtable td { padding: 5px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .rtable tr:hover td { background: var(--card); }
  .rtable .num { text-align: right; color: var(--dim); }
  .rtable .tid { color: var(--text); cursor: pointer; }
  .rtable .tid:hover { color: var(--accent); }
  .minibar { display: inline-flex; height: 8px; width: 130px; border-radius: 4px; overflow: hidden; background: var(--line); vertical-align: -1px; }
  .minibar i { height: 100%; flex: 0 0 auto; }
  .finding { background: var(--card); border-left: 2px solid var(--line); padding: 8px 12px; margin: 7px 0; font-size: 11.5px; }
  .finding.good { border-left-color: var(--done); }
  .finding.warn { border-left-color: var(--running); }
  .finding.info { border-left-color: var(--ready); }
  .finding b { color: var(--text); }
  .finding .why { color: var(--dim); display: block; margin-top: 3px; }
</style>
</head>
<body>
<header>
  <h1>graph</h1><span class="run" id="runName">—</span>
  <button class="lbtn" id="layoutBtn" onclick="toggleLayout()">layout: phase</button>
  <button class="lbtn" onclick="fitView()" title="fit to screen (0)">fit</button>
  <button class="lbtn" id="resBtn" onclick="toggleResults()" title="run metrics (r)">results</button>
  <span id="zoomLvl">100%</span>
  <span class="orch" id="orch"><span class="hb"></span>orchestrator</span>
  <div class="counts" id="counts"></div>
</header>
<main>
  <div id="viewport"><div id="canvas">
    <div id="lanes"></div>
    <div id="orchNode"><span class="obeat"></span><span class="oh">orchestrator</span><span class="os" id="orchSub">idle</span></div>
    <div id="revNode"><span class="obeat"></span><span class="oh">reviewer</span><span class="os" id="revSub">idle</span></div>
    <svg id="edges">
      <defs id="edgeDefs"></defs>
      <g id="edgePaths"></g>
    </svg>
    <div id="nodes"></div>
  </div></div>
  <aside>
    <h3>Legend</h3>
    <div class="legend">
      <span><i style="background:var(--done)"></i>done</span>
      <span><i style="background:var(--running)"></i>running</span>
      <span><i style="background:var(--review)"></i>in review</span>
      <span><i style="background:var(--ready)"></i>ready</span>
      <span><i style="background:var(--waiting)"></i>waiting</span>
      <span><i style="background:var(--failed)"></i>failed</span>
      <span><i style="background:var(--blocked)"></i>blocked</span>
      <span><i class="l-edge"></i>unlocks next</span>
      <span><i style="background:var(--blocked)"></i>dep crosses back a phase</span>
      <span><i style="background:var(--ready)"></i>✓ = validated, awaiting done</span>
    </div>
    <h3 id="parTitle">Running in parallel</h3>
    <div class="par" id="parallel"><span class="empty">nothing running</span></div>
    <h3>Failures &amp; retries</h3>
    <div id="failures"><span class="empty">none</span></div>
    <h3>Event log</h3>
    <div id="events"></div>
  </aside>
</main>
<footer>
  <span class="lbl">graph</span>
  <div id="bar"><div class="seg-done"></div><div class="seg-run"></div><div class="seg-fail"></div></div>
  <span class="n" id="doneCount"></span>
</footer>
<div id="results"></div>
<div id="pop"><span class="close" onclick="closePop()">✕</span><div id="popBody"></div></div>
<script>
const $ = (s) => document.querySelector(s)
let STATE = null
let FOCUS = null        // node id under the mouse (transient lineage highlight)
let POP = null          // { id, pinned } — open popover; hover opens it unpinned, click pins
let dwellTimer = null   // long hover on a node auto-opens the popover
let closeTimer = null   // grace period to travel from node into the popover
let lastEventAt = null  // high-water mark: events past it flash their node once
let lastEdgesHtml = ''  // skip the SVG rebuild when no edge changed (keeps dash flow continuous)
const DWELL_MS = 550, GRACE_MS = 250

const NODE_W = 168, NODE_H = 46, PAD = 40
const SLOT_X = NODE_W + 34          // siblings sit side by side now
const LANE_PAD = 24, LANE_H = LANE_PAD + NODE_H + 40
const ORCH_W = 168, ORCH_H = 60, ORCH_GAP = 58
let CANVAS_W = 0, CANVAS_H = 0
let EVENTS = []
let LAYOUT = (() => { try { return localStorage.getItem('graphLayout') ?? 'phase' } catch { return 'phase' } })()
const VIEW = { x: 0, y: 0, k: 1 }   // the whiteboard transform, survives every re-render
let fitted = false                  // auto-fit once, on the first paint
let LAST_POS = null                 // last computed positions, for centring on a task
let suppressClick = false           // a drag must not open the popover it ended on

/** The transform lives on ONE container: no re-layout, no re-render, and the SVG edges
 *  stay vector-crisp at any zoom. It is reapplied after every tick so the 1.5s refresh
 *  never snaps the board back to the origin. */
function applyView() {
  const c = $('#canvas')
  c.style.transform = `translate(${VIEW.x}px, ${VIEW.y}px) scale(${VIEW.k})`
  c.dataset.lod = VIEW.k < 0.55 ? 'far' : 'near'
  $('#zoomLvl').textContent = `${Math.round(VIEW.k * 100)}%`
  if (POP) positionPop()
}

function fitView() {
  if (RESULTS_OPEN) return backToGraph()
  const vp = $('#viewport').getBoundingClientRect()
  if (!CANVAS_W || !CANVAS_H) return
  const k = Math.min((vp.width - 56) / CANVAS_W, (vp.height - 56) / CANVAS_H, 1.25)
  VIEW.k = Math.max(0.1, k)
  VIEW.x = (vp.width - CANVAS_W * VIEW.k) / 2
  VIEW.y = (vp.height - CANVAS_H * VIEW.k) / 2
  applyView()
}

function zoomAt(mx, my, factor) {
  const k2 = Math.min(2.5, Math.max(0.1, VIEW.k * factor))
  VIEW.x = mx - (mx - VIEW.x) * (k2 / VIEW.k)
  VIEW.y = my - (my - VIEW.y) * (k2 / VIEW.k)
  VIEW.k = k2
  applyView()
}

function toggleLayout() {
  // pressed from the results tab it means "take me back to the graph", not "relayout it"
  if (RESULTS_OPEN) return backToGraph()
  LAYOUT = LAYOUT === 'phase' ? 'depth' : 'phase'
  try { localStorage.setItem('graphLayout', LAYOUT) } catch { /* private mode */ }
  if (STATE) { render(STATE, EVENTS); fitView() }
}
const DOT = { done: '✓', running: '▸', reviewing: '⌕', ready: '·', waiting: '·', failed: '✕', blocked: '⛔', skipped: '–', pending: '·' }
const ST_COLOR = { done: 'var(--done)', running: 'var(--running)', reviewing: 'var(--review)', ready: 'var(--ready)', waiting: 'var(--waiting)', failed: 'var(--failed)', blocked: 'var(--blocked)', skipped: 'var(--skipped)' }

async function tick() {
  try {
    const [sRes, eRes] = await Promise.all([fetch('/api/state'), fetch('/api/events?limit=120')])
    if (!sRes.ok) return
    STATE = await sRes.json()
    EVENTS = (await eRes.json()).events ?? []
    render(STATE, EVENTS)
    if (POP) { fillPop(POP.id); positionPop() }
    if (RESULTS_OPEN) loadResults()   // an open results tab tracks a live run
  } catch { /* server gone — keep last paint */ }
}

function eff(id) { return STATE.derived[id]?.effective ?? STATE.tasks[id].state }

/** Transitive ancestors + descendants of a node — what "related to what" means here. */
function lineage(id) {
  const tasks = STATE.tasks
  const up = new Set(), down = new Set()
  const climb = (n) => tasks[n].deps.forEach((d) => { if (!up.has(d)) { up.add(d); climb(d) } })
  const dependents = {}
  for (const t of Object.values(tasks)) for (const d of t.deps) (dependents[d] ??= []).push(t.id)
  const descend = (n) => (dependents[n] ?? []).forEach((d) => { if (!down.has(d)) { down.add(d); descend(d) } })
  climb(id); descend(id)
  return { up, down, all: new Set([id, ...up, ...down]) }
}

/** Columns are PHASES by default — that is how the plan was authored, and depth alone
 *  scatters one phase across the canvas. `depth` mode keeps longest-path layering.
 *
 *  Rows are NOT packed from the top: each node is pulled to the average Y of what it connects
 *  to (barycentre), then collisions are pushed apart. Top-packing is what turns a wide graph
 *  into a fan of long diagonals — centring a parent on its children keeps edges short. */
function layout(tasks, mode) {
  const depth = {}
  const d = (id, seen = new Set()) => {
    if (depth[id] !== undefined) return depth[id]
    if (seen.has(id)) return 0
    seen.add(id)
    const t = tasks[id]
    depth[id] = t.deps.length ? 1 + Math.max(...t.deps.map((x) => d(x, seen))) : 0
    return depth[id]
  }
  Object.keys(tasks).forEach((id) => d(id))

  const phases = STATE.plan.phases ?? []
  const phaseIx = Object.fromEntries(phases.map((p, i) => [p.id, i]))
  const usePhase = mode === 'phase' && phases.length > 0
  const rowOf = (t) => (usePhase ? phaseIx[t.phase] ?? phases.length : depth[t.id])
  const colOf = rowOf                       // "column" in the graph sense = a layer
  const y0 = PAD + ORCH_H + ORCH_GAP        // the orchestrator sits above everything

  const ids = Object.keys(tasks)
  const preds = {}, succs = {}
  ids.forEach((id) => { preds[id] = []; succs[id] = [] })
  for (const t of Object.values(tasks))
    for (const dep of t.deps) {
      if (!tasks[dep]) continue
      preds[t.id].push(dep)
      succs[dep].push(t.id)
    }

  const byCol = {}
  for (const t of Object.values(tasks)) (byCol[colOf(t)] ??= []).push(t.id)
  const colKeys = Object.keys(byCol).map(Number).sort((a, b) => a - b)
  for (const c of colKeys)
    byCol[c].sort((a, b) => depth[a] - depth[b] || a.localeCompare(b, undefined, { numeric: true }))

  // seed left-packed, then relax: sweep forward pulling to preds, back pulling to succs
  const x = {}
  for (const c of colKeys) byCol[c].forEach((id, i) => { x[id] = PAD + i * SLOT_X })
  for (let pass = 0; pass < 8; pass++) {
    const forward = pass % 2 === 0
    const order = forward ? colKeys : [...colKeys].reverse()
    for (const c of order) {
      const col = byCol[c]
      const want = {}
      for (const id of col) {
        const nb = (forward ? preds[id] : succs[id]).filter((n) => colOf(tasks[n]) !== c)
        want[id] = nb.length ? nb.reduce((s, n) => s + x[n], 0) / nb.length : x[id]
      }
      col.sort((a, b) => want[a] - want[b] || a.localeCompare(b, undefined, { numeric: true }))
      let last = -Infinity
      for (const id of col) {
        x[id] = Math.max(want[id], last + SLOT_X)
        last = x[id]
      }
      // re-centre the lane on what it wanted, or repeated passes drift rightward
      const drift = col.reduce((s, id) => s + (x[id] - want[id]), 0) / col.length
      for (const id of col) x[id] -= drift
    }
  }
  // the sweeps above settled the ORDER; taking their coordinates too spreads a column
  // over huge voids. Re-pack tight in that order, then let each node drift toward its
  // barycentre only as far as its neighbours' slack allows — centred, but never hollow.
  for (const c of colKeys) byCol[c].forEach((id, i) => { x[id] = PAD + i * SLOT_X })
  for (let pass = 0; pass < 6; pass++) {
    const forward = pass % 2 === 0
    for (const c of forward ? colKeys : [...colKeys].reverse()) {
      const col = byCol[c]
      for (let i = 0; i < col.length; i++) {
        const id = col[i]
        const nb = [...preds[id], ...succs[id]].filter((n) => colOf(tasks[n]) !== c)
        if (!nb.length) continue
        const want = nb.reduce((s, n) => s + x[n], 0) / nb.length
        const lo = i === 0 ? PAD : x[col[i - 1]] + SLOT_X
        const hi = i === col.length - 1 ? Infinity : x[col[i + 1]] - SLOT_X
        x[id] = Math.min(Math.max(want, lo), hi)
      }
    }
  }
  const minX = Math.min(...Object.values(x))
  for (const id of ids) x[id] += PAD - minX

  const pos = {}
  for (const t of Object.values(tasks))
    pos[t.id] = { x: x[t.id], y: y0 + rowOf(t) * LANE_H + LANE_PAD }
  const maxRow = Math.max(...Object.values(tasks).map(rowOf))
  const w = Math.max(...Object.values(x)) + NODE_W + PAD
  const h = y0 + (maxRow + 1) * LANE_H + PAD
  return { pos, w, h, usePhase, lanes: usePhase ? phases : [], laneY0: y0 }
}

function fmtElapsed(iso) {
  const s = Math.max(0, Math.floor((Date.now() - Date.parse(iso)) / 1000))
  return s >= 3600 ? `${Math.floor(s / 3600)}h${String(Math.floor((s % 3600) / 60)).padStart(2, '0')}`
    : `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`
}

/** Where a RUNNING task is in the start→validate→done loop, from the current attempt. */
function subState(t) {
  if (t.state !== 'running' && t.state !== 'reviewing') return ''
  const v = t.validations.at(-1)
  if (!v || v.attempt !== t.attempts.length) return 'working'
  return v.ok ? 'validated' : 'valfail'
}

function fmtAge(sec) { return sec < 60 ? `${sec}s` : sec < 3600 ? `${Math.floor(sec / 60)}m` : `${Math.floor(sec / 3600)}h` }

function fmtMs(ms) {
  if (ms == null) return '—'
  const s = Math.round(ms / 1000)
  if (s < 60) return `${s}s`
  if (s < 3600) return `${Math.floor(s / 60)}m${String(s % 60).padStart(2, '0')}`
  return `${Math.floor(s / 3600)}h${String(Math.floor((s % 3600) / 60)).padStart(2, '0')}`
}

/** Every number on the results tab comes from HERE, and everything here is derived from the
 *  attempt/validation timestamps the engine already records. Nothing new is collected, and
 *  no figure is invented: what cannot be derived (tokens) is absent, not estimated. */
function analyse(s, events) {
  const now = Date.now()
  const at = (x) => (x ? Date.parse(x) : null)
  const runStart = at(s.createdAt) ?? now
  const tasks = Object.values(s.tasks)
  const live = (t) => t.state === 'running' || t.state === 'reviewing'

  /* Blocked is the only span with no home in state.json — it lives as a pair of events.
     An unclosed block is still running, so it is measured up to now. */
  const blocked = {}
  const openedAt = {}
  for (const e of events) {
    if (e.type === 'task_block') openedAt[e.task] = at(e.at)
    else if (e.type === 'task_unblock' && openedAt[e.task] != null) {
      blocked[e.task] = (blocked[e.task] ?? 0) + (at(e.at) - openedAt[e.task])
      delete openedAt[e.task]
    }
  }
  for (const [id, t0] of Object.entries(openedAt)) blocked[id] = (blocked[id] ?? 0) + (now - t0)

  /* Spread is measured over INDIVIDUAL reviews, not per-task totals: a task reviewed twice
     honestly cost twice, and counting it as one slow review would fake the very variance
     that distinguishes "the gate is a fixed toll" from "review scales with the task". */
  const reviewEach = []
  const per = tasks.map((t) => {
    let exec = 0, review = 0
    for (const a of t.attempts) {
      const st = at(a.startedAt)
      if (st == null) continue
      const rv = at(a.reviewStartedAt)
      const en = at(a.endedAt) ?? (live(t) ? now : null)
      const execEnd = rv ?? en
      if (execEnd != null) exec += Math.max(0, execEnd - st)
      if (rv != null && en != null) {
        review += Math.max(0, en - rv)
        reviewEach.push(Math.max(0, en - rv))
      }
    }
    /* A task became READY when its last dep finished — the engine stores no readyAt, but
       the dep's own endedAt is that instant. Unknown for a skipped dep (never timestamped),
       and the honest answer there is "—", never a guess. */
    const depEnds = t.deps.map((d) => {
      const dep = s.tasks[d]
      return dep && dep.state === 'done' ? at(dep.attempts.at(-1)?.endedAt) : null
    })
    const readyAt = t.deps.length === 0 ? runStart : depEnds.some((x) => x == null) ? null : Math.max(...depEnds)
    const firstStart = at(t.attempts[0]?.startedAt)
    const queue = readyAt != null && firstStart != null ? Math.max(0, firstStart - readyAt) : null
    const verdicts = t.validations.filter((v) => v.by === 'review')
    return {
      id: t.id, title: t.title, state: t.state, exec, review, queue,
      blocked: blocked[t.id] ?? 0,
      attempts: t.attempts.length,
      rejected: verdicts.filter((v) => !v.ok).length,
      approved: verdicts.filter((v) => v.ok).length,
      reviewed: verdicts.length > 0,
      skipsReview: (t.requireReview ?? s.plan.requireReview) === false,
      agentTime: exec + review,
    }
  })

  const sum = (f) => per.reduce((n, p) => n + f(p), 0)
  const execTotal = sum((p) => p.exec)
  const reviewTotal = sum((p) => p.review)
  const agentTotal = execTotal + reviewTotal
  const lastEnd = Math.max(runStart, ...tasks.flatMap((t) => t.attempts.map((a) => at(a.endedAt) ?? 0)))
  const anyLive = tasks.some(live)
  const wall = (anyLive ? now : lastEnd) - runStart

  /* The critical path is the floor no amount of parallelism can go under: the longest chain
     of dependent work. Comparing it to the wall clock says whether the graph's SHAPE or the
     executor count is the limit — the difference between "add agents" and "restructure". */
  const W = Object.fromEntries(per.map((p) => [p.id, p.agentTime]))
  const memo = {}, from = {}
  const cp = (id) => {
    if (memo[id] != null) return memo[id]
    let best = 0, via = null
    for (const d of s.tasks[id].deps) if (s.tasks[d] && cp(d) > best) { best = cp(d); via = d }
    from[id] = via
    return (memo[id] = best + (W[id] ?? 0))
  }
  let cpEnd = null
  for (const id of Object.keys(s.tasks)) if (cpEnd == null || cp(id) > cp(cpEnd)) cpEnd = id
  const cpLen = cpEnd ? cp(cpEnd) : 0
  const cpChain = []
  for (let n = cpEnd; n; n = from[n]) cpChain.unshift(n)

  const mean = reviewEach.length ? reviewEach.reduce((x, y) => x + y, 0) / reviewEach.length : 0
  const sd = reviewEach.length
    ? Math.sqrt(reviewEach.reduce((x, y) => x + (y - mean) ** 2, 0) / reviewEach.length) : 0
  /* Candidate selection compares a TASK's whole review bill against the MEDIAN, not the
     mean: one twice-reviewed task drags a mean above every well-behaved task and the list
     comes back empty exactly when it would be most useful. */
  const taskReviews = per.filter((p) => p.review > 0).map((p) => p.review).sort((x, y) => x - y)
  const taskReviewMid = taskReviews.length ? taskReviews[Math.floor((taskReviews.length - 1) / 2)] : 0

  return {
    per, execTotal, reviewTotal, agentTotal, wall,
    speedup: wall > 0 ? agentTotal / wall : 0,
    maxExec: s.plan.maxExecutors ?? 3,
    cap: s.plan.maxParallel ?? 4,
    cpLen, cpChain,
    retries: sum((p) => Math.max(0, p.attempts - 1)),
    rejections: sum((p) => p.rejected),
    reviews: sum((p) => p.approved + p.rejected),
    blockedTotal: sum((p) => p.blocked),
    reviewCV: mean > 0 ? sd / mean : 0,
    reviewMean: mean,
    taskReviewMid,
    anyLive,
  }
}

/* Every free-text field in state.json (titles, evidence, reasons, notes, agent labels)
   is agent-authored — escape it at EVERY interpolation into markup. The server is
   read-only, so this page is the only place injected markup could ever execute. */
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
/* Ids that land inside onclick='...' attributes: JS-string-escape, THEN HTML-escape —
   the HTML parser decodes entities before the JS engine ever sees the string. */
const jsq = (v) => esc(String(v ?? '').replace(/\\/g, '\\\\').replace(/'/g, "\\'"))

/* timestamps are stored in UTC (ISO); render them in the viewer's own timezone */
function fmtTime(iso) { return iso ? new Date(iso).toLocaleTimeString(undefined, { hour12: false }) : '' }

/* validation may be a prose string or a structured list of {run, expect} steps —
   the engine treats it as opaque; here each step renders as its own line. */
function fmtContract(v) {
  if (!v) return '—'
  if (typeof v === 'string') return esc(v)
  const steps = Array.isArray(v) ? v : [v]
  return steps.map((c) => c.run ? `<code>${esc(c.run)}</code>${c.expect ? ` → ${esc(c.expect)}` : ''}` : esc(JSON.stringify(c))).join('<br>')
}

function render(s, events) {
  /* Anchor CSS animation phase to the page clock for elements RECREATED each render
     (orbit ring, typing dots, sidebar heartbeat): they start mid-cycle instead of at
     frame 0. Never put --epoch on elements that survive ticks (edge paths, hub dots) —
     the var is restamped here every render, and changing animation-delay on a live
     element SHIFTS its phase: that reads as a jump every poll. */
  document.documentElement.style.setProperty('--epoch', `-${(performance.now() / 1000).toFixed(3)}s`)
  $('#runName').textContent = `${s.run} — ${s.plan.name}`
  const tasks = s.tasks
  const list = Object.values(tasks)
  const by = {}
  for (const t of list) by[eff(t.id)] = (by[eff(t.id)] ?? 0) + 1
  $('#counts').innerHTML = ['running', 'reviewing', 'ready', 'waiting', 'blocked', 'failed', 'done', 'skipped']
    .filter((k) => by[k]).map((k) => k === 'blocked'
      ? `<span class="ask">✋ waiting on you <b>${by[k]}</b></span>`
      : `<span>${k} <b>${by[k]}</b></span>`).join('')

  const { pos, w, h, usePhase, lanes, laneY0 } = layout(tasks, LAYOUT)
  const canvas = $('#canvas')
  canvas.style.width = w + 'px'
  canvas.style.height = h + 'px'
  CANVAS_W = w; CANVAS_H = h; LAST_POS = pos
  $('#layoutBtn').textContent = `layout: ${usePhase ? 'phase' : 'depth'}`
  $('#lanes').innerHTML = lanes.map((p, i) => {
    const y = laneY0 + i * LANE_H
    return `<div class="lane" style="top:${y}px;height:${LANE_H - 14}px">
      <span class="lane-h">${esc(p.id)} · ${esc(p.title)}</span></div>`
  }).join('')

  // nodes — a running task also tells WHERE it is in the loop: agent still working
  // (typing dots + orbit), validation failed (rework), or validated and awaiting `done`
  $('#nodes').innerHTML = list.map((t) => {
    const e = eff(t.id)
    const p = pos[t.id]
    const sub2 = subState(t)
    const working = '<span class="work"><i></i><i></i><i></i></span>'
    const sub = e === 'reviewing'
      ? `<span class="ag">⌕ @${esc(t.reviewer)}</span>${sub2 === 'valfail' ? ' <span class="vbadge bad">✗ rejected</span>' : working}`
      : e === 'running' && t.agent
      ? `<span class="ag">@${esc(t.agent)}</span>${sub2 === 'validated' ? ' <span class="vbadge ok">✓ validated</span>'
          : sub2 === 'valfail' ? ' <span class="vbadge bad">✗ rework</span>' + working : working}`
      : e === 'blocked'
      ? `<span class="ask">✋ waiting on you</span>${t.blockReason ? ` <span style="color:var(--dim)">— ${esc(t.blockReason)}</span>` : ''}`
      : e === 'waiting' ? `← ${esc(s.derived[t.id].blockedBy.join(','))}`
      : esc(t.title)
    const retry = t.attempts.length > 1 ? ` ↻${t.attempts.length}` : ''
    const run = t.attempts.at(-1)
    const clock = e === 'reviewing' ? run?.reviewStartedAt : e === 'running' ? run?.startedAt : null
    const elapsed = clock ? `<span class="elapsed">${fmtElapsed(clock)}</span>` : ''
    return `<div class="node" data-st="${e}" data-sub="${sub2}" data-id="${esc(t.id)}" style="left:${p.x}px;top:${p.y}px" onclick="openTask('${jsq(t.id)}')">
      ${elapsed}<span class="dot">${sub2 === 'validated' ? '✓' : DOT[e] ?? ''}</span>
      <span class="id">${esc(t.id)}<small style="color:var(--dim);font-weight:400"> ${esc(t.phase ?? '')}${retry}</small></span>
      <span class="sub">${sub}</span></div>`
  }).join('')

  // edges — color tells the story: green = dep delivered, amber flowing = feeding a
  // running task, amber pulsing dots = a running task's output that will UNLOCK the
  // target, red = source failed, gray = idle. One path per edge so focus can light them.
  const svg = $('#edges')
  svg.setAttribute('width', w); svg.setAttribute('height', h)
  if (!$('#edgeDefs').innerHTML) $('#edgeDefs').innerHTML = ['done', 'hot', 'next', 'failed', 'idle', 'back', 'dispatch', 'review'].map((k) => {
    const c = { done: 'var(--done)', hot: 'var(--running)', next: 'var(--running)', failed: 'var(--failed)', idle: 'var(--line)', back: 'var(--blocked)', dispatch: 'var(--accent)', review: 'var(--review)' }[k]
    return `<marker id="m-${k}" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 7 4 L 0 7" fill="none" stroke="${c}" stroke-width="1.6" stroke-linejoin="round"/></marker>`
  }).join('')
  let edgesHtml = ''
  for (const t of list) {
    for (const dep of t.deps) {
      const a = pos[dep], b = pos[t.id]
      if (!a || !b) continue
      const es = eff(dep), et = eff(t.id)
      const stateCls = es === 'failed' ? 'e-failed'
        : et === 'running' ? 'e-hot'
        : es === 'running' ? 'e-next'
        : es === 'done' || es === 'skipped' ? 'e-done'
        : 'e-idle'
      const ax = a.x + NODE_W / 2, bx = b.x + NODE_W / 2
      let d, cls
      if (a.y > b.y) {
        // dep sits in a LATER band than its dependant — the phase order hides this
        // constraint, so route it around the SIDE and colour it apart
        const side = Math.max(ax, bx) + NODE_W / 2 + 40
        d = `M ${a.x + NODE_W} ${a.y + NODE_H / 2} C ${side} ${a.y + NODE_H / 2}, ${side} ${b.y + NODE_H / 2}, ${b.x + NODE_W} ${b.y + NODE_H / 2}`
        cls = 'e-back'
      } else if (a.y === b.y) {
        // same band: dip BELOW the row — a straight horizontal run would cross every
        // card between the two, which reads as a line to nowhere
        const py = a.y + NODE_H - 8
        const dip = Math.min(30, 12 + Math.abs(bx - ax) * 0.05)
        d = `M ${ax} ${a.y + NODE_H} C ${ax} ${py + dip + 14}, ${bx} ${py + dip + 14}, ${bx} ${b.y + NODE_H + 4}`
        cls = stateCls
      } else {
        const y1 = a.y + NODE_H, y2 = b.y - 4
        const bend = Math.max(24, (y2 - y1) * 0.5)
        d = `M ${ax} ${y1} C ${ax} ${y1 + bend}, ${bx} ${y2 - bend}, ${bx} ${y2}`
        cls = stateCls
      }
      edgesHtml += `<path class="${cls}" data-from="${esc(dep)}" data-to="${esc(t.id)}" d="${d}"/>`
    }
  }
  // orchestrator sits ABOVE the graph, centred, fanning a live line down to each task
  // it is running — dispatch reads as descent, which is the direction of the whole graph
  const runningNow = list.filter((t) => eff(t.id) === 'running')
  const inReview = list.filter((t) => eff(t.id) === 'reviewing')
  const cx = w / 2, HUB_GAP = 26
  const ox = cx - ORCH_W - HUB_GAP / 2, oy = PAD
  const on = $('#orchNode')
  on.style.left = `${ox}px`
  on.style.top = `${oy}px`
  on.classList.toggle('live', runningNow.length > 0)
  $('#orchSub').textContent = runningNow.length
    ? `dispatching ${runningNow.length}/${s.plan.maxParallel ?? 4}`
    : 'idle'
  const ocx = ox + ORCH_W / 2, ocy = oy + ORCH_H
  for (const t of runningNow) {
    const b = pos[t.id]
    if (!b) continue
    const x2 = b.x + NODE_W / 2, y2 = b.y - 4
    const bend = Math.max(30, (y2 - ocy) * 0.45)
    edgesHtml += `<path class="e-dispatch" data-from="__orch" data-to="${esc(t.id)}" d="M ${ocx} ${ocy} C ${ocx} ${ocy + bend}, ${x2} ${y2 - bend}, ${x2} ${y2}"/>`
  }
  // reviewer sits beside the orchestrator, both above the graph: a task is dispatched
  // DOWN and climbs back UP to be judged before it may proceed. Keeping the hubs off the
  // vertical axis matters — down that axis means PHASE ORDER, and a hub parked at the
  // bottom reads as "after every phase", which is not when review happens.
  const rx = cx + HUB_GAP / 2, ry = PAD
  const rn = $('#revNode')
  rn.style.left = `${rx}px`
  rn.style.top = `${ry}px`
  rn.classList.toggle('live', inReview.length > 0)
  $('#revSub').textContent = inReview.length
    ? `judging ${inReview.map((t) => t.id).join(', ')}`
    : 'idle'
  const rcx = rx + ORCH_W / 2, rcy = ry + ORCH_H
  for (const t of inReview) {
    const b = pos[t.id]
    if (!b) continue
    // drawn task → reviewer: the arrow lands on the hub, so it reads as going BACK up
    const x1 = b.x + NODE_W / 2, y1 = b.y - 4
    const bend = Math.max(30, (y1 - rcy) * 0.45)
    edgesHtml += `<path class="e-review" data-from="${esc(t.id)}" data-to="__rev" d="M ${x1} ${y1} C ${x1} ${y1 - bend}, ${rcx} ${rcy + bend}, ${rcx} ${rcy + 4}"/>`
  }
  /* Only touch the SVG when an edge actually changed: recreating a path restarts its
     dash-flow animation, and (unlike the HTML elements) the --epoch anchor does not
     reliably resume SVG stroke-dashoffset mid-cycle. Identical markup = same graph =
     nothing to redraw; the flow then runs untouched between state changes. */
  if (edgesHtml !== lastEdgesHtml) {
    $('#edgePaths').innerHTML = edgesHtml
    lastEdgesHtml = edgesHtml
  }

  // footer progress
  const total = list.length
  $('#bar .seg-done').style.width = `${(100 * (by.done ?? 0)) / total}%`
  $('#bar .seg-run').style.width = `${(100 * (by.running ?? 0)) / total}%`
  $('#bar .seg-fail').style.width = `${(100 * (by.failed ?? 0)) / total}%`
  $('#doneCount').innerHTML = `<b>${by.done ?? 0}</b> done / ${total}`

  // orchestrator heartbeat — the last thing it did and how long ago; beating while active
  const last = events.at(-1)
  const orch = $('#orch')
  if (last) {
    const age = Math.max(0, Math.floor((Date.now() - Date.parse(last.at)) / 1000))
    orch.classList.toggle('live', age < 30)
    orch.innerHTML = `<span class="hb"></span>orch <b>${esc(last.type.replace('task_', '').replace('run_', ''))}</b> ${esc(last.task ?? '')} · ${fmtAge(age)}`
  } else {
    orch.classList.remove('live')
    orch.innerHTML = '<span class="hb"></span>orchestrator idle'
  }

  // side panels — logs and run state only
  const running = list.filter((t) => eff(t.id) === 'running')
  const maxExec = s.plan.maxExecutors ?? 3
  $('#parTitle').innerHTML = `Working <span style="color:${running.length >= maxExec ? 'var(--running)' : 'var(--dim)'}">${running.length}/${maxExec}</span> · review <span style="color:${inReview.length ? 'var(--review)' : 'var(--dim)'}">${inReview.length}</span>`
  $('#parallel').innerHTML = running.length || inReview.length
    ? [
        ...running.map((t) => `<span onclick="openTask('${jsq(t.id)}')"><i class="sp"></i>${esc(t.id)} <span style="color:var(--accent)">@${esc(t.agent)}</span></span>`),
        ...inReview.map((t) => `<span class="rev" onclick="openTask('${jsq(t.id)}')"><i class="sp rev"></i>${esc(t.id)} <span style="color:var(--review)">⌕ @${esc(t.reviewer)}</span></span>`),
      ].join('')
    : '<span class="empty">nothing running</span>'
  const bad = list.filter((t) => eff(t.id) === 'failed' || t.attempts.length > 1)
  $('#failures').innerHTML = bad.length
    ? bad.map((t) => `<div class="ev">${esc(t.id)} — ${t.attempts.length} attempt(s)${t.attempts.at(-1)?.reason ? ` · ${esc(t.attempts.at(-1).reason)}` : ''}</div>`).join('')
    : '<span class="empty">none</span>'
  $('#events').innerHTML = events.slice().reverse().map((e) => {
    const extra = e.reason ?? e.evidence ?? e.agent ?? e.text ?? ''
    return `<div class="ev"><span class="t-${esc(e.type)}"><time>${fmtTime(e.at)}</time><b>${esc(e.type.replace('task_', ''))}</b> ${esc(e.task ?? '')} <span style="color:var(--dim)">${esc(String(extra).slice(0, 80))}</span></span></div>`
  }).join('')

  // one-shot flash on nodes touched by events that arrived since the previous tick
  const fresh = lastEventAt ? events.filter((e) => e.at > lastEventAt) : []
  lastEventAt = events.at(-1)?.at ?? lastEventAt
  for (const e of fresh) {
    if (!e.task) continue
    const n = document.querySelector(`.node[data-id="${CSS.escape(e.task)}"]`)
    const cls = e.type === 'task_done' ? 'flash-done'
      : e.type === 'task_validate' ? (e.ok ? 'flash-val' : 'flash-bad')
      : e.type === 'task_start' ? 'flash-start'
      : e.type === 'task_fail' ? 'flash-bad' : null
    if (n && cls) n.classList.add(cls)
  }

  applyFocus()
  if (!fitted) { fitted = true; fitView() } else applyView()
}

/** Light the focused node's full lineage; dim the rest. Survives re-renders. */
function applyFocus() {
  const id = FOCUS ?? POP?.id
  const canvas = $('#canvas')
  document.querySelectorAll('.node.lit, .node.lit-self').forEach((n) => n.classList.remove('lit', 'lit-self'))
  document.querySelectorAll('#edgePaths path.lit').forEach((p) => p.classList.remove('lit'))
  if (!id || !STATE?.tasks[id]) { canvas.classList.remove('focus'); return }
  const { all } = lineage(id)
  canvas.classList.add('focus')
  document.querySelectorAll('.node').forEach((n) => {
    if (all.has(n.dataset.id)) n.classList.add('lit')
    if (n.dataset.id === id) n.classList.add('lit-self')
  })
  document.querySelectorAll('#edgePaths path').forEach((p) => {
    if (all.has(p.dataset.from) && all.has(p.dataset.to)) p.classList.add('lit')
  })
}

$('#nodes').addEventListener('mouseover', (e) => {
  const n = e.target.closest('.node')
  if (!n) return
  if (n.dataset.id !== FOCUS) { FOCUS = n.dataset.id; applyFocus() }
  clearTimeout(closeTimer)
  if (POP?.pinned) return
  if (POP?.id === n.dataset.id) return
  clearTimeout(dwellTimer)
  dwellTimer = setTimeout(() => openPop(n.dataset.id, false), DWELL_MS)
})
$('#nodes').addEventListener('mouseout', (e) => {
  const n = e.target.closest('.node')
  if (!n || (e.relatedTarget && n.contains(e.relatedTarget))) return
  clearTimeout(dwellTimer)
  if (POP && !POP.pinned) scheduleClose()
})
$('#nodes').addEventListener('mouseleave', () => { FOCUS = null; applyFocus() })
$('#pop').addEventListener('mouseenter', () => clearTimeout(closeTimer))
$('#pop').addEventListener('mouseleave', () => { if (POP && !POP.pinned) scheduleClose() })

function scheduleClose() {
  clearTimeout(closeTimer)
  closeTimer = setTimeout(closePop, GRACE_MS)
}

/** Anchor the popover beside its node: right of it when there is room, left otherwise. */
function positionPop() {
  if (!POP) return
  const node = document.querySelector(`.node[data-id="${CSS.escape(POP.id)}"]`)
  const pop = $('#pop')
  if (!node) return
  const r = node.getBoundingClientRect()
  const pw = pop.offsetWidth, ph = pop.offsetHeight
  let x = r.right + 14
  if (x + pw > innerWidth - 12) x = r.left - pw - 14
  x = Math.max(12, Math.min(x, innerWidth - pw - 12))
  let y = r.top - 6
  y = Math.max(52, Math.min(y, innerHeight - ph - 50))
  pop.style.left = `${x}px`
  pop.style.top = `${y}px`
}
addEventListener('resize', positionPop)

// ---- whiteboard navigation: drag the empty board to pan, ctrl/⌘+wheel to zoom at the
// cursor, plain wheel/trackpad to pan. A drag under the click threshold is still a click.
const vp = $('#viewport')
vp.addEventListener('wheel', (e) => {
  e.preventDefault()
  if (e.ctrlKey || e.metaKey) {
    const r = vp.getBoundingClientRect()
    zoomAt(e.clientX - r.left, e.clientY - r.top, Math.exp(-e.deltaY * 0.0016))
  } else {
    VIEW.x -= e.deltaX
    VIEW.y -= e.deltaY
    applyView()
  }
}, { passive: false })

let drag = null
vp.addEventListener('pointerdown', (e) => {
  if (e.button !== 0) return
  suppressClick = false
  drag = { sx: e.clientX, sy: e.clientY, vx: VIEW.x, vy: VIEW.y, moved: false, id: e.pointerId }
})
vp.addEventListener('pointermove', (e) => {
  if (!drag) return
  const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy
  if (!drag.moved && Math.hypot(dx, dy) < 4) return
  if (!drag.moved) {
    // capture only once a real pan starts — capturing on pointerdown would retarget the
    // click event to the viewport, and a plain click on a card would never reach it
    drag.moved = true
    vp.setPointerCapture(drag.id)
    vp.classList.add('panning')
    clearTimeout(dwellTimer)
  }
  VIEW.x = drag.vx + dx
  VIEW.y = drag.vy + dy
  applyView()
})
const endDrag = () => {
  if (drag?.moved) suppressClick = true
  drag = null
  vp.classList.remove('panning')
}
vp.addEventListener('pointerup', endDrag)
vp.addEventListener('pointercancel', endDrag)

document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return
  const r = vp.getBoundingClientRect()
  if (e.key === 'r' || e.key === 'R') toggleResults()
  else if (e.key === 'Escape' && RESULTS_OPEN) toggleResults()
  else if (RESULTS_OPEN) return   // the canvas keys mean nothing while results is up
  else if (e.key === '0') fitView()
  else if (e.key === '+' || e.key === '=') zoomAt(r.width / 2, r.height / 2, 1.2)
  else if (e.key === '-' || e.key === '_') zoomAt(r.width / 2, r.height / 2, 1 / 1.2)
})

function fillPop(id) {
  const t = STATE.tasks[id]
  if (!t) return
  const e = eff(id)
  const c = ST_COLOR[e] ?? 'var(--dim)'
  const run = t.attempts.at(-1)
  const ss = subState(t)
  const live = e === 'running' && run?.startedAt
    ? `${ss === 'validated' ? ' ✓ validated' : ss === 'valfail' ? ' ✗ rework' : ''} · ${fmtElapsed(run.startedAt)}` : ''
  const depChip = (d) => `<span class="dep" onclick="openTask('${jsq(d)}')">${DOT[eff(d)] ?? ''} ${esc(d)}</span>`
  const dependents = Object.values(STATE.tasks).filter((x) => x.deps.includes(id)).map((x) => x.id)
  $('#popBody').innerHTML = `
    <h2>${esc(t.id)} <span class="st" style="color:${c};border-color:${c}">${e}${live}</span></h2>
    <div style="color:var(--dim);font-size:12px;margin-top:4px">${esc(t.title)}</div>
    <dl>
      <dt>Phase</dt><dd>${esc(t.phase ?? '—')}</dd>
      <dt>Depends on</dt><dd>${t.deps.map(depChip).join('') || '—'}</dd>
      <dt>Unlocks</dt><dd>${dependents.map(depChip).join('') || '—'}</dd>
      <dt>Validation contract</dt><dd>${fmtContract(t.validation)}</dd>
      ${t.blockReason ? `<dt>Blocked</dt><dd>${esc(t.blockReason)}</dd>` : ''}
      ${t.skipReason ? `<dt>Skipped</dt><dd>${esc(t.skipReason)}</dd>` : ''}
      <dt>Attempts</dt><dd>${t.attempts.map((a) =>
        `<div class="att">#${a.n} @${esc(a.agent)} · ${fmtTime(a.startedAt)}${a.endedAt ? ` → ${fmtTime(a.endedAt)}` : ' (running)'} ${esc(a.result ?? '')} ${esc(a.reason ?? '')}</div>`).join('') || '—'}</dd>
      <dt>Validations</dt><dd>${t.validations.map((v) =>
        `<div class="vitem ${v.ok ? '' : 'bad'}">${v.ok ? 'OK' : 'FAILED'} · ${fmtTime(v.at)}<br>${esc(v.evidence)}</div>`).join('') || '—'}</dd>
      <dt>Notes</dt><dd>${t.notes.map((n) => `<div class="att">${fmtTime(n.at)} — ${esc(n.text)}</div>`).join('') || '—'}</dd>
    </dl>
    ${POP?.pinned ? '' : '<div class="pin-hint">click the task to pin · moves away, closes</div>'}`
}

/* ---- results tab ---------------------------------------------------------------
   The graph answers "where is the run"; this answers "where did the run GO". It exists so
   the next plan is authored from evidence — above all `requireReview`, which is a human
   decision the engine deliberately never makes for itself. */
let RESULTS_OPEN = false
let FULL_EVENTS = []      // the tick fetches 120 events; the analysis needs the whole history

async function toggleResults() {
  RESULTS_OPEN = !RESULTS_OPEN
  $('#results').classList.toggle('open', RESULTS_OPEN)
  /* The button that opened the tab is the button that closes it — a view with no visible way
     back reads as a dead end, and "press the same thing again" is not a way back. */
  $('#resBtn').textContent = RESULTS_OPEN ? '← graph' : 'results'
  $('#resBtn').style.color = RESULTS_OPEN ? 'var(--text)' : ''
  /* Only the zoom READOUT is dimmed — layout and fit stay lit because here they still do
     something (they take you back), and dimming a control that works reads as disabled. */
  $('#zoomLvl').style.opacity = RESULTS_OPEN ? '.3' : ''
  if (RESULTS_OPEN) { closePop(); await loadResults() }
}

function backToGraph() { if (RESULTS_OPEN) toggleResults() }

async function loadResults() {
  try {
    const r = await fetch('/api/events?limit=100000')
    FULL_EVENTS = (await r.json()).events ?? []
  } catch { /* keep whatever we had */ }
  if (STATE) renderResults(STATE)
}

function renderResults(s) {
  const a = analyse(s, FULL_EVENTS)
  const pct = (n, d) => (d > 0 ? Math.round((100 * n) / d) : 0)
  const bar = (l, r) => {
    const lp = pct(l, l + r)
    return `<span class="minibar"><i style="width:${lp}%;background:var(--running)"></i><i style="width:${100 - lp}%;background:var(--review)"></i></span>`
  }
  const tile = (k, v, sub) => `<div class="tile"><div class="k">${k}</div><div class="v">${v}</div><div class="s">${sub ?? ''}</div></div>`

  const execPct = pct(a.execTotal, a.agentTotal)
  const ranked = a.per.filter((p) => p.agentTime > 0).sort((x, y) => y.agentTime - x.agentTime)

  // findings: only what the numbers actually support, each with the evidence beside it
  const f = []
  if (a.cpLen > 0) {
    const headroom = a.wall - a.cpLen
    f.push(headroom / Math.max(1, a.wall) < 0.25
      ? `<div class="finding good"><b>The graph shape is the limit, not the agent count.</b>
         <span class="why">The critical path (${fmtMs(a.cpLen)}) is ${pct(a.cpLen, a.wall)}% of the wall clock (${fmtMs(a.wall)}) — more executors cannot beat that chain. To go faster, break the chain: ${esc(a.cpChain.join(' → '))}.</span></div>`
      : `<div class="finding warn"><b>There is parallelism left on the table.</b>
         <span class="why">The critical path is only ${fmtMs(a.cpLen)} of a ${fmtMs(a.wall)} run, so ${fmtMs(headroom)} went to waiting rather than to dependency — check retries, blocks and dispatch gaps before adding executors.</span></div>`)
  }
  if (a.reviewTotal > 0) {
    f.push(a.reviewCV < 0.35
      ? `<div class="finding warn"><b>Review cost looks FIXED, not proportional — suspect the gate.</b>
         <span class="why">Review takes ${fmtMs(a.reviewMean)} on average with little spread between tasks (variation ${Math.round(a.reviewCV * 100)}%). A reviewer that costs the same on a one-line task and a large one is paying a constant: usually the full suite running per task. Scope the gate to what the task changed and keep the full run for the end.</span></div>`
      : `<div class="finding info"><b>Review cost scales with the task.</b>
         <span class="why">Spread across tasks is ${Math.round(a.reviewCV * 100)}% of the mean, so review time tracks task size rather than a fixed per-task toll — the gate is not the constant here.</span></div>`)
  }
  if (a.reviews > 0) {
    f.push(a.rejections > 0
      ? `<div class="finding good"><b>Review caught ${a.rejections} defect(s) in ${a.reviews} verdict(s).</b>
         <span class="why">A ${pct(a.rejections, a.reviews)}% rejection rate is what the ${pct(a.reviewTotal, a.agentTotal)}% of agent time spent reviewing bought. Compare that against the cost of those defects reaching the tasks built on top of them, not against zero.</span></div>`
      : `<div class="finding info"><b>Review approved everything it saw (${a.reviews} verdicts, 0 rejections).</b>
         <span class="why">One clean run is not proof the gate is redundant — but it is the signal to start marking the safest tasks below as <code>requireReview: false</code> and watch whether defects appear.</span></div>`)
  }
  /* Candidates are DESCRIBED, never applied: turning off a task's gate is the dev's call,
     made in the plan. The tab's job is to replace a guess with evidence. */
  const cands = ranked.filter((p) => !p.skipsReview && p.reviewed && p.rejected === 0 && p.attempts === 1 && p.review >= a.taskReviewMid)
  if (cands.length) {
    f.push(`<div class="finding info"><b>${cands.length} task(s) where review cost above average and never found anything:</b>
      <span class="why">${cands.map((p) => `${esc(p.id)} (${fmtMs(p.review)})`).join(', ')} — passed first try, no rejection. If they are mechanical by nature, <code>"requireReview": false</code> in the next plan reclaims ${fmtMs(cands.reduce((n, p) => n + p.review, 0))}. If they are merely easy-looking, leave the gate on: those are where a confident agent errs quietly.</span></div>`)
  }

  $('#results').innerHTML = `
    <button class="lbtn" onclick="backToGraph()" style="margin-bottom:14px">← back to the graph</button>
    <h2>${esc(s.run)} — ${esc(s.plan.name)}</h2>
    <div class="note">Derived from this run's attempt timestamps and event log${a.anyLive ? ' · run still ACTIVE, figures move' : ''}. Tokens are not shown: the engine makes no model calls and never sees them — read those from your agent harness.</div>

    <div class="tiles">
      ${tile('Wall clock', fmtMs(a.wall), a.anyLive ? 'so far' : 'init → last task')}
      ${tile('Agent time', fmtMs(a.agentTotal), 'what one agent would have spent')}
      ${tile('Parallel gain', `${a.speedup.toFixed(2)}×`, `${a.maxExec} executors + review headroom`)}
      ${tile('Critical path', fmtMs(a.cpLen), `${pct(a.cpLen, a.wall)}% of wall clock`)}
      ${tile('Review share', `${pct(a.reviewTotal, a.agentTotal)}%`, `${a.reviews} verdicts · ${a.rejections} rejected`)}
      ${tile('Retries', String(a.retries), a.blockedTotal > 0 ? `blocked ${fmtMs(a.blockedTotal)}` : 'no human blocks')}
    </div>

    <h3>Agent time: building vs verifying</h3>
    <div class="split">
      <div style="width:${execPct}%;background:var(--running)">${execPct >= 12 ? `exec ${fmtMs(a.execTotal)}` : ''}</div>
      <div style="width:${100 - execPct}%;background:var(--review)">${100 - execPct >= 12 ? `review ${fmtMs(a.reviewTotal)}` : ''}</div>
    </div>

    <h3>Per task</h3>
    <table class="rtable">
      <tr><th>Task</th><th class="num">Exec</th><th class="num">Review</th><th>build vs verify</th>
          <th class="num">Queued</th><th class="num">Blocked</th><th class="num">Att.</th><th class="num">Verdicts</th></tr>
      ${ranked.map((p) => `<tr>
        <td class="tid" onclick="jumpTo('${jsq(p.id)}')">${esc(p.id)} <span style="color:var(--dim)">${esc((p.title ?? '').slice(0, 34))}</span></td>
        <td class="num">${fmtMs(p.exec)}</td>
        <td class="num">${p.skipsReview ? '<span style="color:var(--dim)">gate only</span>' : fmtMs(p.review)}</td>
        <td>${p.review > 0 ? bar(p.exec, p.review) : ''}</td>
        <td class="num">${p.queue == null ? '—' : fmtMs(p.queue)}</td>
        <td class="num">${p.blocked > 0 ? `<span style="color:var(--blocked)">${fmtMs(p.blocked)}</span>` : '—'}</td>
        <td class="num">${p.attempts > 1 ? `<span style="color:var(--running)">↻${p.attempts}</span>` : p.attempts}</td>
        <td class="num">${p.approved ? `<span style="color:var(--done)">✓${p.approved}</span> ` : ''}${p.rejected ? `<span style="color:var(--failed)">✗${p.rejected}</span>` : ''}${!p.reviewed ? '—' : ''}</td>
      </tr>`).join('')}
    </table>

    <h3>What the numbers support</h3>
    ${f.join('') || '<div class="finding">Not enough finished work to say anything yet.</div>'}`
}

function jumpTo(id) {
  toggleResults()
  openPop(id, true)
}

function openPop(id, pinned) {
  if (suppressClick) { suppressClick = false; return }
  if (drag?.moved) return
  clearTimeout(dwellTimer)
  clearTimeout(closeTimer)
  POP = { id, pinned: pinned || (POP?.id === id && POP.pinned) }
  const pop = $('#pop')
  pop.classList.add('open')
  pop.classList.toggle('pinned', POP.pinned)
  fillPop(id)
  positionPop()
  applyFocus()
}
/** Pinned open — used by node click, dep/unlock chips and the parallel panel. */
function openTask(id) {
  openPop(id, true)
}

/** Centre the board on a task — used when jumping from the side panel or a dep chip. */
function focusTask(id) {
  const p = LAST_POS?.[id]
  if (!p) return
  const r = $('#viewport').getBoundingClientRect()
  VIEW.x = r.width / 2 - (p.x + NODE_W / 2) * VIEW.k
  VIEW.y = r.height / 2 - (p.y + NODE_H / 2) * VIEW.k
  applyView()
}
function closePop() {
  clearTimeout(closeTimer)
  POP = null
  $('#pop').classList.remove('open', 'pinned')
  applyFocus()
}
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closePop() })
document.addEventListener('click', (e) => {
  if (POP?.pinned && !e.target.closest('#pop') && !e.target.closest('.node') && !e.target.closest('.par')) closePop()
})

tick()
setInterval(tick, 1500)
</script>
</body>
</html>
