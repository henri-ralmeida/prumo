name: CI · Prumo
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    name: Planejar lotes
    runs-on: ubuntu-latest
    outputs:
      regular: ${{ steps.plan.outputs.regular }}
      published: ${{ steps.plan.outputs.published }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile --ignore-scripts
      - id: plan
        run: node .github/scripts/ci-plan.mjs
      - uses: actions/upload-artifact@v6
        with:
          name: ci-plan
          path: .test-output/ci-plan.json
          if-no-files-found: error
  test:
    name: Testes · ${{ matrix.os == 'ubuntu-latest' && 'Linux' || matrix.os == 'macos-latest' && 'macOS' || 'Win' }} · N${{ matrix.node }} · ${{ matrix.label }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.regular) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile --ignore-scripts
      # Cada grupo preserva o inventario completo em conjunto com os demais runners.
      - run: node .github/scripts/run-ci-batch.mjs
        env:
          PRUMO_TEST_CONCURRENCY: ${{ runner.os == 'Windows' && 1 || 4 }}
          PRUMO_TEST_PARTITIONED: ${{ runner.os == 'Windows' && '1' || '0' }}
          PRUMO_CI_TEST_FILES: ${{ toJSON(matrix.files) }}
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: coverage-${{ matrix.os }}-node-${{ matrix.node }}-${{ matrix.label }}
          path: |
            .test-output/coverage/coverage-final.json
            .test-output/coverage/coverage-summary.json
            .test-output/coverage/source-manifest.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: verification-${{ matrix.os }}-node-${{ matrix.node }}-${{ matrix.label }}
          path: |
            .test-output/
            !.test-output/coverage/tmp/**
          include-hidden-files: true
          if-no-files-found: ignore
  published:
    name: Update · ${{ matrix.os == 'ubuntu-latest' && 'Linux' || matrix.os == 'macos-latest' && 'macOS' || 'Win' }} · N${{ matrix.node }} · ${{ matrix.label }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.published) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile --ignore-scripts
      # Cada runner conserva os cenarios historicos sequenciais, com homes, portas e caches isolados.
      - run: bun run test:coverage:collect
        env:
          PRUMO_TEST_SUITE: published
          PRUMO_TEST_CONCURRENCY: 1
          PRUMO_TEST_PUBLISHED_SHARD_INDEX: 0
          PRUMO_TEST_PUBLISHED_SHARD_COUNT: 1
          PRUMO_CI_PUBLISHED_VERSIONS: ${{ toJSON(matrix.versions) }}
      - name: Resumir resultados das versões publicadas
        if: always()
        shell: pwsh
        run: ./.github/scripts/published-update-summary.ps1 -ResultsPath ".test-output/published-update-results.json"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: coverage-published-${{ matrix.os }}-node-${{ matrix.node }}-${{ matrix.label }}
          path: |
            .test-output/coverage/coverage-final.json
            .test-output/coverage/coverage-summary.json
            .test-output/coverage/source-manifest.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: verification-published-${{ matrix.os }}-node-${{ matrix.node }}-${{ matrix.label }}
          path: |
            .test-output/
            !.test-output/coverage/tmp/**
          include-hidden-files: true
          if-no-files-found: ignore
  package:
    name: Pacote · ${{ matrix.os }} · N${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: npm run check
      - run: npm pack
      - run: node scripts/package-smoke.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: verification-package-${{ matrix.os }}-node-${{ matrix.node }}
          path: .test-output/
          include-hidden-files: true
          if-no-files-found: ignore
  coverage:
    name: coverage
    needs: [test, published, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@v7
        with:
          pattern: coverage-*
          path: .test-output/coverage-artifacts
      - run: bun run coverage:merge
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: consolidated-coverage
          path: .test-output/coverage-merged/
