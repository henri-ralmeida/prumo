name: Verify Prumo
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - uses: oven-sh/setup-bun@v2
      - run: node --test --test-concurrency=4 scripts/*.test.mjs test/*.test.mjs
      - run: npm run check
      - run: npm pack
      - run: node scripts/package-smoke.mjs
      - run: node scripts/published-update-smoke.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: verification-${{ matrix.os }}-node-${{ matrix.node }}
          path: .test-output/
          include-hidden-files: true
          if-no-files-found: ignore
